# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^extract_stats\.py$
      - id: end-of-file-fixer
        exclude: ^extract_stats\.py$
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: detect-aws-credentials
        args:
          - --allow-missing-credentials

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: \.(js|ts|jsx|tsx|css|scss|json|yaml|yml)$
        # lockfile は自動生成物のため整形対象外
        exclude: (package-lock\.json|pnpm-lock\.yaml)$

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.1.28
    hooks:
      # - id: rumdl      # Lint only (fails on issues)
      - id: rumdl-fmt # Auto-format and fail if issues remain
        # README.md は upstream 管理のため対象外
        exclude: ^README\.md$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^extract_stats\.py$
      - id: ruff-format
        exclude: ^extract_stats\.py$
